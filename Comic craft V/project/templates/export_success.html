<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Complete — ComicCraft</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="success-page">
    <main class="success-card">
        <div class="success-icon">✓</div>
        <span class="badge">EXPORT COMPLETE</span>
        <h1>Your comic is ready!</h1>
        <p>Your ComicCraft PDF has been generated successfully.</p>
        {% if filename %}
        <a class="primary-btn inline-btn" href="/download/{{ filename }}">📄 Download Again</a>
        {% endif %}
        <a class="secondary-btn inline-btn" href="/">✨ Create Another Comic</a>
    </main>
</body>
</html>
